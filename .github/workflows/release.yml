name: Compile Release
on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Validate release tag
        run: |
          set -euo pipefail
          expected="$(python - <<'PY'
          import configparser
          config = configparser.ConfigParser()
          config.read('platformio.ini', encoding='utf-8')
          print(config['crosspoint']['version'])
          PY
          )"
          actual="${GITHUB_REF_NAME#v}"
          if [ "$actual" != "$expected" ]; then
            echo "Release tag '$GITHUB_REF_NAME' does not match platformio.ini version '$expected'" >&2
            exit 1
          fi
          echo "CROSSPOINT_RELEASE_VERSION=$expected" >> "$GITHUB_ENV"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build CrossPoint
        run: pio run -e gh_release

      - name: Validate firmware image metadata
        run: |
          set -euo pipefail
          info="$(python "$HOME/.platformio/packages/tool-esptoolpy/esptool.py" image-info \
            .pio/build/gh_release/firmware.bin)"
          grep -Fqx "App version: $CROSSPOINT_RELEASE_VERSION" <<< "$info"
          grep -E '^Checksum: .*\(valid\)$' <<< "$info"
          grep -E '^Validation hash: .*\(valid\)$' <<< "$info"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CrossPoint-${{ github.ref_name }}
          path: |
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
            .pio/build/gh_release/partitions.bin

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd .pio/build/gh_release
          sha256sum firmware.bin > firmware.bin.sha256
          upstream_version="${GITHUB_REF_NAME%%-vns.*}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" firmware.bin firmware.bin.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" firmware.bin firmware.bin.sha256 \
              --verify-tag \
              --title "CrossPoint Văn Nhân Số $GITHUB_REF_NAME" \
              --notes "Custom firmware for Xteink X3/X4, based on CrossPoint Reader stable $upstream_version."
          fi
